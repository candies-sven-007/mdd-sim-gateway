name: Build arm64 release

# The offline Debian 11 arm64 package (build/build-arm64.sh). Uploaded as a workflow artifact
# only: no release, no tag, no registry. Runs on demand, or on a push to the slim branch whose
# commit message contains [arm64].
on:
  workflow_dispatch:
  push:
    branches:
      - slim-reader-vowifi

permissions:
  contents: read

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[arm64]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run build
        working-directory: webui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-dist
          path: webui/dist
          retention-days: 1

  package:
    needs: webui
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye
    timeout-minutes: 180
    steps:
      # bullseye-security left deb.debian.org for archive.debian.org after LTS ended (its pool
      # answers 404 there; bullseye/main is still served). Build container only; the device's
      # apt sources are never changed by this project. build-arm64.sh repeats this, idempotently.
      - name: Point bullseye-security at archive.debian.org
        run: |
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$file" ]; then sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' "$file"; fi
          done
          grep -rn security /etc/apt/sources.list /etc/apt/sources.list.d/ || true
      - name: Tools the checkout needs
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webui-dist
          path: webui-dist
      - name: Version
        id: version
        run: echo "value=$(tr -d ' \n' < VERSION)-slim.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash build/build-arm64.sh "${{ steps.version.outputs.value }}" webui-dist out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdd-slim-arm64-${{ steps.version.outputs.value }}
          path: out/*
          retention-days: 30
          compression-level: 0
